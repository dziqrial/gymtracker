<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gym Tracker</title>
    <meta name="theme-color" content="#1f2937" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json" />
  </head>
  <body
    class="bg-gray-900 text-gray-100 min-h-screen p-4 font-sans selection:bg-emerald-500 selection:text-white"
  >
    <div class="max-w-md mx-auto">
      <div class="flex justify-between items-center mb-6 mt-2">
        <h1 class="text-2xl font-bold text-emerald-400">Progress Mingguan</h1>
      </div>

      <div id="workout-container" class="space-y-6"></div>

      <button
        onclick="resetWeek()"
        class="mt-8 w-full bg-red-600/20 text-red-500 border border-red-500/50 hover:bg-red-600 hover:text-white transition-colors font-bold py-3 px-4 rounded-xl shadow-lg"
      >
        Reset untuk Minggu Depan
      </button>
    </div>

    <script>
      // Mendaftarkan Service Worker biar bisa Full Offline
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .catch((err) => console.log("Gagal pasang offline mode: ", err));
        });
      }

      const defaultRoutine = [
        {
          day: "Upper Body",
          exercises: [
            {
              name: "Incline Chest Press",
              target: "2 sets to failure",
              weight: "",
              reps: "",
            },
            {
              name: "Pec Deck Flies",
              target: "2 sets to failure",
              weight: "",
              reps: "",
            },
            {
              name: "Weighted Pull-ups",
              target: "2 sets to failure",
              weight: "",
              reps: "",
            },
            {
              name: "Weighted Dips",
              target: "2 sets to failure",
              weight: "",
              reps: "",
            },
            {
              name: "Cable Lateral Raises",
              target: "2 sets to failure",
              weight: "",
              reps: "",
            },
            {
              name: "Carter Extensions",
              target: "2 sets to failure",
              weight: "",
              reps: "",
            },
            {
              name: "Biceps Curls",
              target: "2 sets to failure",
              weight: "",
              reps: "",
            },
          ],
        },
        {
          day: "Lower Body",
          exercises: [
            {
              name: "Leg Extensions",
              target: "2 sets to failure",
              weight: "",
              reps: "",
            },
            {
              name: "Leg Curls",
              target: "2 sets to failure",
              weight: "",
              reps: "",
            },
            {
              name: "Adductor Machine",
              target: "2 sets to failure",
              weight: "",
              reps: "",
            },
            {
              name: "Calf Raises",
              target: "2 sets to failure",
              weight: "",
              reps: "",
            },
          ],
        },
      ];

      let routine =
        JSON.parse(localStorage.getItem("gymRoutine")) || defaultRoutine;

      function render() {
        const container = document.getElementById("workout-container");
        container.innerHTML = "";

        routine.forEach((dayData, dayIndex) => {
          const dayCard = document.createElement("div");
          dayCard.className =
            "bg-gray-800 p-5 rounded-2xl shadow-lg border border-gray-700/50";

          let exHtml = `<h2 class="text-lg font-bold mb-4 text-gray-200 border-b border-gray-700 pb-2">${dayData.day}</h2><div class="space-y-5">`;

          dayData.exercises.forEach((ex, exIndex) => {
            exHtml += `
                        <div class="group relative bg-gray-900/50 p-3 rounded-xl border border-gray-700/50">
                            <div class="flex justify-between items-center mb-2 gap-2">
                                <!-- Input buat ganti nama latihan langsung -->
                                <input type="text" class="bg-transparent border-b border-dashed border-gray-600 focus:border-emerald-500 outline-none text-sm font-medium text-emerald-300 w-full pb-1 transition-colors" 
                                    value="${ex.name}" 
                                    onchange="updateData(${dayIndex}, ${exIndex}, 'name', this.value)"
                                    placeholder="Nama Latihan">
                                
                                <button onclick="deleteExercise(${dayIndex}, ${exIndex})" class="text-gray-500 hover:text-red-400 p-1 transition-colors rounded">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                    </svg>
                                </button>
                            </div>
                            <div class="text-xs text-gray-500 mb-2">${ex.target}</div>
                            <div class="flex gap-3">
                                <div class="relative w-1/2">
                                    <input type="number" step="0.5" class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg p-2.5 pl-3 pr-8 text-sm focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all" 
                                        value="${ex.weight}" oninput="updateData(${dayIndex}, ${exIndex}, 'weight', this.value)">
                                    <span class="absolute right-3 top-2.5 text-xs text-gray-500 font-medium pointer-events-none">kg</span>
                                </div>
                                <div class="relative w-1/2">
                                    <input type="number" class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg p-2.5 pl-3 pr-10 text-sm focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all" 
                                        value="${ex.reps}" oninput="updateData(${dayIndex}, ${exIndex}, 'reps', this.value)">
                                    <span class="absolute right-3 top-2.5 text-xs text-gray-500 font-medium pointer-events-none">reps</span>
                                </div>
                            </div>
                        </div>
                    `;
          });

          exHtml += `
                    </div>
                    <button onclick="addExercise(${dayIndex})" class="mt-4 w-full flex items-center justify-center gap-2 text-sm text-emerald-400 bg-emerald-400/10 hover:bg-emerald-400/20 py-2.5 rounded-lg border border-emerald-400/30 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                        Tambah Latihan
                    </button>
                `;
          dayCard.innerHTML = exHtml;
          container.appendChild(dayCard);
        });
      }

      function updateData(dayIndex, exIndex, field, value) {
        routine[dayIndex].exercises[exIndex][field] = value;
        localStorage.setItem("gymRoutine", JSON.stringify(routine));
      }

      function addExercise(dayIndex) {
        routine[dayIndex].exercises.push({
          name: "Latihan Baru",
          target: "2 sets to failure",
          weight: "",
          reps: "",
        });
        localStorage.setItem("gymRoutine", JSON.stringify(routine));
        render();
      }

      function deleteExercise(dayIndex, exIndex) {
        if (confirm("Hapus latihan ini?")) {
          routine[dayIndex].exercises.splice(exIndex, 1);
          localStorage.setItem("gymRoutine", JSON.stringify(routine));
          render();
        }
      }

      function resetWeek() {
        if (
          confirm(
            "Reset beban dan reps untuk minggu depan? Latihan tidak akan terhapus.",
          )
        ) {
          // Cuma ngosongin weight & reps, daftar dan nama latihan tetap aman
          routine = routine.map((day) => ({
            ...day,
            exercises: day.exercises.map((ex) => ({
              ...ex,
              weight: "",
              reps: "",
            })),
          }));
          localStorage.setItem("gymRoutine", JSON.stringify(routine));
          render();
        }
      }

      render();
    </script>
  </body>
</html>
